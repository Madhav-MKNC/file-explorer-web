<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="explorer-token" content="{{ csrf_token }}" />
        <meta name="color-scheme" content="light" />
        <title>File Explorer</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles.css') }}"
        />
        <script defer src="{{ url_for('static', filename='app.js') }}"></script>
    </head>
    <body>
        <svg
            class="icon-library"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <symbol id="i-folder" viewBox="0 0 24 24">
                <path
                    fill="#e6ac35"
                    d="M2 6a2 2 0 0 1 2-2h6l2 3h8a2 2 0 0 1 2 2v10H2z"
                />
                <path fill="#f5ca65" d="M2 9h20l-2 11H4z" />
            </symbol>
            <symbol id="i-file" viewBox="0 0 24 24">
                <path fill="#fff" stroke="#8196ac" d="M5 2h9l5 5v15H5z" />
                <path fill="#e4edf6" stroke="#8196ac" d="M14 2v6h5" />
                <path stroke="#8196ac" d="M8 12h8M8 15h8M8 18h5" />
            </symbol>
            <symbol id="i-pc" viewBox="0 0 24 24">
                <rect
                    x="2"
                    y="3"
                    width="20"
                    height="14"
                    rx="2"
                    fill="#dfeefb"
                    stroke="#277aba"
                />
                <path stroke="#277aba" stroke-width="2" d="M12 17v4M7 21h10" />
                <path stroke="#fff" d="M5 6h14" />
            </symbol>
            <symbol id="i-drive" viewBox="0 0 24 24">
                <path
                    fill="#dce4eb"
                    stroke="#7a8c9a"
                    d="m5 4-3 11v5h20v-5L19 4z"
                />
                <path fill="#f3f6f9" stroke="#7a8c9a" d="M2 15h20" />
                <circle cx="18" cy="18" r="1" fill="#277aba" />
            </symbol>
            <symbol id="i-back" viewBox="0 0 24 24">
                <path d="m11 5-7 7 7 7M4 12h16" />
            </symbol>
            <symbol id="i-forward" viewBox="0 0 24 24">
                <path d="m13 5 7 7-7 7M4 12h16" />
            </symbol>
            <symbol id="i-up" viewBox="0 0 24 24">
                <path d="m5 11 7-7 7 7M12 4v16" />
            </symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24">
                <path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6" />
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 5 5" />
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
            </symbol>
            <symbol id="i-chevron" viewBox="0 0 24 24">
                <path d="m8 5 7 7-7 7" />
            </symbol>
            <symbol id="i-down" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6" />
            </symbol>
            <symbol id="i-cut" viewBox="0 0 24 24">
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="18" r="3" />
                <path d="m4 3 12 13M20 3 8 16" />
            </symbol>
            <symbol id="i-copy" viewBox="0 0 24 24">
                <rect x="8" y="8" width="12" height="13" rx="2" />
                <path d="M15 8V3H3v13h5" />
            </symbol>
            <symbol id="i-paste" viewBox="0 0 24 24">
                <path d="M8 4H4v17h16V4h-4" />
                <rect x="8" y="2" width="8" height="5" rx="1" />
                <path d="M8 12h8M8 16h6" />
            </symbol>
            <symbol id="i-rename" viewBox="0 0 24 24">
                <path d="M10 5H3v14h7M17 5h4v14h-4M11 2h6M14 2v20M11 22h6" />
            </symbol>
            <symbol id="i-trash" viewBox="0 0 24 24">
                <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" />
            </symbol>
            <symbol id="i-download" viewBox="0 0 24 24">
                <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
            </symbol>
            <symbol id="i-upload" viewBox="0 0 24 24">
                <path d="M12 17V3m-5 5 5-5 5 5M4 16v5h16v-5" />
            </symbol>
            <symbol id="i-grid" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
            </symbol>
            <symbol id="i-list" viewBox="0 0 24 24">
                <path d="M8 5h13M8 12h13M8 19h13M3 5h1M3 12h1M3 19h1" />
            </symbol>
            <symbol id="i-info" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 10v7M12 6v1" />
            </symbol>
            <symbol id="i-open" viewBox="0 0 24 24">
                <path d="M13 3h8v8M21 3 10 14M10 5H3v16h16v-7" />
            </symbol>
            <symbol id="i-more" viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="1" />
                <circle cx="12" cy="12" r="1" />
                <circle cx="19" cy="12" r="1" />
            </symbol>
            <symbol id="i-close" viewBox="0 0 24 24">
                <path d="m6 6 12 12M18 6 6 18" />
            </symbol>
            <symbol id="i-eye" viewBox="0 0 24 24">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
            </symbol>
            <symbol id="i-sort" viewBox="0 0 24 24">
                <path d="M7 3v18m-4-4 4 4 4-4M14 5h7M14 10h5M14 15h3" />
            </symbol>
            <symbol id="i-menu" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </symbol>
            <symbol id="i-image" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8" cy="8" r="2" />
                <path d="m3 18 6-6 4 4 4-7 4 8" />
            </symbol>
            <symbol id="i-media" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="m10 8 7 4-7 4Z" />
            </symbol>
            <symbol id="i-lock" viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="11" rx="2" />
                <path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3" />
            </symbol>
        </svg>

        <div class="explorer">
            <header class="titlebar">
                <div class="title-tab">
                    <svg class="icon"><use href="#i-folder" /></svg
                    ><span id="tab-title">This PC</span>
                </div>
                <span class="app-name"
                    >File Explorer <span class="local-label">Local</span></span
                >
                <form class="logout-form" method="post" action="{{ url_for('logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
                    <button type="submit" title="Sign out" aria-label="Sign out">
                        <svg class="icon small"><use href="#i-lock" /></svg>
                        <span>Sign out</span>
                    </button>
                </form>
            </header>
            <nav class="commandbar" aria-label="File commands">
                <button class="command" data-menu="new" title="Create an item">
                    <svg class="icon"><use href="#i-plus" /></svg
                    ><span>New</span
                    ><svg class="icon small"><use href="#i-down" /></svg>
                </button>
                <span class="separator"></span>
                <button
                    class="command icon-only"
                    data-action="cut"
                    title="Cut (Ctrl+X)"
                    aria-label="Cut"
                >
                    <svg class="icon"><use href="#i-cut" /></svg>
                </button>
                <button
                    class="command icon-only"
                    data-action="copy"
                    title="Copy (Ctrl+C)"
                    aria-label="Copy"
                >
                    <svg class="icon"><use href="#i-copy" /></svg>
                </button>
                <button
                    class="command icon-only"
                    data-action="paste"
                    title="Paste (Ctrl+V)"
                    aria-label="Paste"
                >
                    <svg class="icon"><use href="#i-paste" /></svg>
                </button>
                <button
                    class="command icon-only"
                    data-action="rename"
                    title="Rename (F2)"
                    aria-label="Rename"
                >
                    <svg class="icon"><use href="#i-rename" /></svg>
                </button>
                <button
                    class="command icon-only"
                    data-action="download"
                    title="Download selection"
                    aria-label="Download"
                >
                    <svg class="icon"><use href="#i-download" /></svg>
                </button>
                <button
                    class="command icon-only"
                    data-action="delete"
                    title="Move to Recycle Bin (Delete)"
                    aria-label="Move to Recycle Bin"
                >
                    <svg class="icon"><use href="#i-trash" /></svg>
                </button>
                <button
                    class="command"
                    id="restore-button"
                    data-action="restore"
                    hidden
                >
                    <svg class="icon"><use href="#i-refresh" /></svg
                    ><span>Restore</span>
                </button>
                <span class="separator"></span>
                <button class="command" data-menu="upload">
                    <svg class="icon"><use href="#i-upload" /></svg
                    ><span>Upload</span
                    ><svg class="icon small"><use href="#i-down" /></svg>
                </button>
                <button class="command" data-menu="sort">
                    <svg class="icon"><use href="#i-sort" /></svg
                    ><span>Sort</span
                    ><svg class="icon small"><use href="#i-down" /></svg>
                </button>
                <button class="command" data-menu="view">
                    <svg class="icon"><use href="#i-list" /></svg
                    ><span>View</span
                    ><svg class="icon small"><use href="#i-down" /></svg>
                </button>
                <button
                    class="command icon-only"
                    data-menu="more"
                    title="More commands"
                    aria-label="More commands"
                >
                    <svg class="icon"><use href="#i-more" /></svg>
                </button>
            </nav>
            <div class="navigation">
                <button
                    class="nav-button sidebar-toggle"
                    data-action="sidebar"
                    aria-label="Toggle navigation pane"
                    aria-expanded="false"
                >
                    <svg class="icon"><use href="#i-menu" /></svg>
                </button>
                <button
                    class="nav-button"
                    data-action="back"
                    title="Back (Alt+Left)"
                    aria-label="Back"
                >
                    <svg class="icon"><use href="#i-back" /></svg>
                </button>
                <button
                    class="nav-button"
                    data-action="forward"
                    title="Forward (Alt+Right)"
                    aria-label="Forward"
                >
                    <svg class="icon"><use href="#i-forward" /></svg>
                </button>
                <button
                    class="nav-button"
                    data-action="up"
                    title="Up (Alt+Up)"
                    aria-label="Up"
                >
                    <svg class="icon"><use href="#i-up" /></svg>
                </button>
                <button
                    class="nav-button"
                    data-action="refresh"
                    title="Refresh (F5)"
                    aria-label="Refresh"
                >
                    <svg class="icon"><use href="#i-refresh" /></svg>
                </button>
                <div
                    class="address"
                    id="address"
                    title="Click the blank area to enter a path (Ctrl+L)"
                >
                    <svg class="icon address-icon"><use href="#i-pc" /></svg>
                    <nav id="breadcrumbs" aria-label="Folder path"></nav>
                    <form id="address-form" hidden>
                        <input
                            id="address-input"
                            aria-label="Folder path"
                            spellcheck="false"
                            autocomplete="off"
                        />
                    </form>
                    <button
                        class="address-edit"
                        data-action="address"
                        title="Edit path (Ctrl+L)"
                        aria-label="Edit path"
                    >
                        <svg class="icon small"><use href="#i-down" /></svg>
                    </button>
                </div>
                <form class="search" id="search-form" role="search">
                    <input
                        id="search-input"
                        type="search"
                        placeholder="Search folder"
                        aria-label="Search folder"
                        autocomplete="off"
                    />
                    <button type="submit" aria-label="Search">
                        <svg class="icon"><use href="#i-search" /></svg>
                    </button>
                </form>
            </div>
            <div id="notice" class="notice" role="status" hidden>
                <span id="notice-text"></span
                ><button id="notice-details" hidden>Details</button
                ><button
                    class="icon-only"
                    id="notice-close"
                    aria-label="Dismiss message"
                >
                    <svg class="icon small"><use href="#i-close" /></svg>
                </button>
            </div>
            <div class="body">
                <aside
                    id="sidebar"
                    class="sidebar"
                    aria-label="Navigation pane"
                >
                    <button class="side-item" data-action="home">
                        <svg class="icon"><use href="#i-pc" /></svg
                        ><span>This PC</span>
                    </button>
                    <button class="side-item" data-action="recycle-bin">
                        <svg class="icon"><use href="#i-trash" /></svg
                        ><span>Recycle Bin</span>
                    </button>
                    <div class="side-label">Quick access</div>
                    <div id="shortcuts"></div>
                    <div class="side-label">Devices and drives</div>
                    <div id="side-drives"></div>
                    <div class="sidebar-note">
                        <svg class="icon small"><use href="#i-lock" /></svg
                        ><span>C: access is limited to Users.</span>
                    </div>
                </aside>
                <main id="main" class="main">
                    <div class="folder-heading">
                        <div>
                            <h1 id="folder-title">This PC</h1>
                            <p id="folder-subtitle">Devices and drives</p>
                        </div>
                        <div class="view-buttons">
                            <button
                                data-action="details"
                                class="nav-button"
                                title="Details view"
                                aria-label="Details view"
                            >
                                <svg class="icon">
                                    <use href="#i-list" />
                                </svg></button
                            ><button
                                data-action="grid"
                                class="nav-button"
                                title="Large icons"
                                aria-label="Large icons"
                            >
                                <svg class="icon"><use href="#i-grid" /></svg>
                            </button>
                        </div>
                    </div>
                    <div
                        id="search-summary"
                        class="search-summary"
                        hidden
                    ></div>
                    <div id="home-view" class="home-view"></div>
                    <div
                        id="column-header"
                        class="column-header"
                        role="group"
                        aria-label="Sort files"
                        hidden
                    >
                        <button data-sort="name">Name</button
                        ><button data-sort="modified">Date modified</button
                        ><button data-sort="type">Type</button
                        ><button data-sort="size">Size</button>
                    </div>
                    <div
                        id="file-list"
                        class="file-list details"
                        role="listbox"
                        aria-label="Folder contents"
                        aria-multiselectable="true"
                        tabindex="0"
                        hidden
                    ></div>
                    <div id="empty-state" class="empty-state" hidden></div>
                    <div id="drop-overlay" class="drop-overlay" hidden>
                        <svg class="icon"><use href="#i-upload" /></svg
                        ><strong>Drop files to upload</strong
                        ><span id="drop-destination"></span>
                    </div>
                </main>
            </div>
            <footer class="statusbar">
                <span id="item-count">Loading...</span
                ><span id="selection-status"></span
                ><span id="clipboard-status"></span
                ><span
                    class="busy-status"
                    id="busy-status"
                    role="status"
                    aria-live="polite"
                ></span>
            </footer>
        </div>
        <input id="upload-files" type="file" multiple hidden />
        <input
            id="upload-folder"
            type="file"
            multiple
            webkitdirectory
            directory
            hidden
        />
        <div id="context-menu" class="context-menu" role="menu" hidden></div>

        <dialog id="modal" class="modal" aria-labelledby="modal-title">
            <form id="modal-form">
                <div class="modal-heading">
                    <h2 id="modal-title"></h2>
                    <button
                        type="button"
                        class="nav-button"
                        id="modal-close"
                        aria-label="Close"
                    >
                        <svg class="icon"><use href="#i-close" /></svg>
                    </button>
                </div>
                <div id="modal-content"></div>
                <div id="modal-actions" class="modal-actions"></div>
            </form>
        </dialog>
        <dialog id="preview" class="preview" aria-labelledby="preview-title">
            <div class="preview-heading">
                <div>
                    <h2 id="preview-title"></h2>
                    <p id="preview-caption"></p>
                </div>
                <button
                    class="nav-button"
                    id="preview-close"
                    aria-label="Close preview"
                >
                    <svg class="icon"><use href="#i-close" /></svg>
                </button>
            </div>
            <div class="preview-toolbar">
                <button data-preview="download">
                    <svg class="icon"><use href="#i-download" /></svg
                    >Download</button
                ><button id="edit-button" data-preview="edit" hidden>
                    Edit text</button
                ><button
                    id="save-button"
                    data-preview="save"
                    class="primary"
                    hidden
                >
                    Save (Ctrl+S)
                </button>
            </div>
            <div id="preview-body" class="preview-body"></div>
        </dialog>
        <noscript
            ><div class="noscript">
                Enable JavaScript to use File Explorer.
            </div></noscript
        >
    </body>
</html>
